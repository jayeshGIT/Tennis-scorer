<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tennis Score">
<meta name="theme-color" content="#0f1115">
<title>Tennis Scorer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --panel2:#20242d; --line:#2a2f3a; --text:#f2f4f8; --muted:#8b93a3;
  --accent:#c6f432; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b; --purple:#a855f7;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;border:0;-webkit-user-select:none;user-select:none}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px);
  max-width:560px;margin:0 auto}
.screen{display:none;flex:1;flex-direction:column;gap:14px}
.screen.active{display:flex}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.5px}
h2{font-size:20px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.pill{background:var(--panel2);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;min-height:44px}
.pill:disabled{opacity:.35}
.big{width:100%;border-radius:18px;padding:20px;font-size:20px;font-weight:700;min-height:64px}
.primary{background:var(--accent);color:#111}
.secondary{background:var(--panel2);color:var(--text)}
.danger{background:#3a1d1f;color:#ff8a8a}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
/* Home */
.hero{text-align:center;padding:30px 0 10px}
.hero .ball{font-size:64px;line-height:1}
.resume-info{font-size:15px;margin-top:4px}
/* Setup */
label.f{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px;text-transform:uppercase;letter-spacing:.6px}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:transparent;border-radius:9px;padding:11px 6px;font-size:15px;font-weight:600;color:var(--muted);min-height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.on{background:var(--accent);color:#111}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fieldset{display:flex;flex-direction:column;gap:14px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
/* Scoreboard */
.sb{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sbrow{display:flex;align-items:center;padding:12px 12px;gap:8px}
.sbrow+.sbrow{border-top:1px solid var(--line)}
.sdot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:transparent}
.sdot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.sname{flex:1;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ssets{display:flex;gap:4px}
.ssets span{width:24px;text-align:center;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums;position:relative}
.ssets span.w{color:var(--text);font-weight:700}
.ssets sup{font-size:10px;position:absolute;top:-4px;right:-3px}
.sgames{width:34px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.spts{min-width:56px;text-align:center;font-size:22px;font-weight:800;background:var(--panel2);border-radius:10px;padding:6px 6px;color:var(--accent);font-variant-numeric:tabular-nums}
.sbfoot{display:flex;justify-content:space-between;padding:8px 12px;background:var(--panel2);font-size:13px;color:var(--muted);gap:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:28px}
.tag{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.tag.bp{background:#3b1414;color:#ff7b7b}
.tag.sp{background:#2a2410;color:#ffd166}
.tag.mp{background:#2b1438;color:#e0a2ff}
.tag.tb{background:#10263b;color:#7cc0ff}
.tag.dp{background:#1d2a12;color:#bff27a}
/* Prompt */
.prompt{text-align:center;margin-top:4px}
.prompt .q{font-size:24px;font-weight:800;letter-spacing:-.3px}
.prompt .sub{font-size:14px;color:var(--muted);margin-top:4px}
.actions{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:flex-end;min-height:260px}
.act{flex:1;border-radius:22px;font-size:28px;font-weight:800;min-height:84px;max-height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;transition:transform .06s}
.act:active{transform:scale(.97);filter:brightness(1.15)}
.act small{font-size:13px;font-weight:600;opacity:.75}
.a-ace{background:#14532d;color:#86efac}
.a-in{background:var(--accent);color:#111}
.a-fault{background:#4a3410;color:#fbbf24}
.a-df{background:#4c1616;color:#fca5a5}
.a-p0{background:#1e3a8a;color:#dbeafe}
.a-p1{background:#581c87;color:#f3e8ff}
.act .nm{max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Stats */
.stitle{text-align:center}
.winner{font-size:15px;color:var(--accent);font-weight:700;margin-top:4px}
table.st{width:100%;border-collapse:collapse;background:var(--panel);border-radius:18px;overflow:hidden;font-size:14px}
table.st th,table.st td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--line)}
table.st tr:last-child td{border-bottom:0}
table.st th{background:var(--panel2);font-size:15px}
table.st th.lbl{text-align:left}
table.st td.lbl{text-align:left;color:var(--muted);font-size:13px;width:36%}
table.st td.best{color:var(--text);font-weight:700}
table.st td{color:#c9ced8;font-variant-numeric:tabular-nums}
.res{display:inline-block;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}
.res.win{background:#14532d;color:#86efac}.res.lose{background:#4c1616;color:#fca5a5}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* History */
.hlist{display:flex;flex-direction:column;gap:10px}
.hitem{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%}
.hitem .t{font-weight:700;font-size:16px}
.hitem .s{color:var(--muted);font-size:13px;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(var(--sab) + 16px);display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.sechead{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:8px 2px 8px}
.mrow{display:flex;gap:8px;align-items:stretch}
.mopen{flex:1;min-width:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.mopen .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mopen .s{color:var(--muted);font-size:13px;margin-top:4px}
.mopen .s.score{color:var(--accent);font-weight:700;font-size:15px}
.mdel{flex:0 0 56px;border-radius:16px;background:#2a1517;border:1px solid #4a2023;font-size:20px}
.sheet-bg.center{align-items:center;padding:20px}
.dialog{background:var(--panel);border:1px solid var(--line);width:100%;max-width:400px;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.dialog .dt{font-size:20px;font-weight:800}
.dialog .dm{color:var(--muted);font-size:15px;line-height:1.4;margin-bottom:6px}
.dangerSolid{background:var(--red);color:#fff}
#btnSave{padding:10px 12px}
.actions.how .act{font-size:23px;text-align:center}
.actions.how .act .nm{white-space:normal}
.ghlegend{font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.ghlegend b{color:var(--text)}
.ghset{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 8px;display:flex;justify-content:space-between}
.ghset b{color:var(--accent)}
.gh{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.gh.live{border-color:var(--accent);border-style:dashed}
.ghh{display:flex;align-items:center;gap:8px;font-size:14px}
.ghn{color:var(--muted);font-weight:700;width:28px;flex:0 0 28px}
.ghsrv{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.ghsrv i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 8px}
.ghw{font-weight:700;white-space:nowrap}
.ghsc{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.brk{font-size:10px;font-weight:800;letter-spacing:.8px;padding:3px 6px;border-radius:6px;background:#3b1414;color:#ff7b7b}
.tbb{font-size:10px;font-weight:800;letter-spacing:.8px;padding:3px 6px;border-radius:6px;background:#10263b;color:#7cc0ff}
.ipb{font-size:10px;font-weight:800;letter-spacing:.8px;padding:3px 6px;border-radius:6px;background:#1d2a12;color:#bff27a}
.ghp{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ghp span{font-size:12px;padding:3px 6px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ghp .p0{background:#1e3a8a;color:#dbeafe}.ghp .p1{background:#581c87;color:#f3e8ff}
.ghp sup{font-size:9px;font-weight:800;margin-left:2px;color:var(--accent)}
.ghp .end{font-weight:800}
.ghk{display:flex;gap:10px;justify-content:center;font-size:12px;color:var(--muted);margin-top:6px}
.ghk span:before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ghk .k0:before{background:#1e3a8a}.ghk .k1:before{background:#581c87}
@media (max-height:700px){ .act{min-height:70px;font-size:24px} .prompt .q{font-size:21px} .sbrow{padding:9px 12px} }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section class="screen" id="s-home">
    <div class="hero">
      <div class="ball">🎾</div>
      <h1>Tennis Scorer</h1>
      <div class="muted small">One tap per step. Saved on this device.</div>
    </div>
    <button class="big primary" id="btnNew">New match</button>
    <div id="savedWrap" style="display:none">
      <div class="sechead">Saved matches (in progress) · <span id="savedCount"></span></div>
      <div class="hlist" id="savedList"></div>
    </div>
    <button class="big secondary" id="btnHistory">Match history</button>
    <div class="muted small" style="text-align:center;margin-top:18px;opacity:.6">Version 4 · with Game history</div>
  </section>

  <!-- SETUP -->
  <section class="screen" id="s-setup">
    <div class="topbar"><button class="pill" data-go="home">‹ Back</button><h2>Match setup</h2><span style="width:70px"></span></div>
    <div class="fieldset">
      <div class="row2">
        <div><label class="f" for="nA">Player 1</label><input type="text" id="nA" maxlength="20" autocomplete="off"></div>
        <div><label class="f" for="nB">Player 2</label><input type="text" id="nB" maxlength="20" autocomplete="off"></div>
      </div>
      <div><label class="f">Sets</label><div class="seg" data-key="bestOf">
        <button data-v="1">1 set</button><button data-v="3">Best of 3</button><button data-v="5">Best of 5</button></div></div>
      <div><label class="f">Games per set</label><div class="seg" data-key="games">
        <button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button><button data-v="8">8</button></div></div>
      <div><label class="f">Tiebreak at games-all</label><div class="seg" data-key="tiebreak">
        <button data-v="1">Yes (to 7)</button><button data-v="0">No (win by 2)</button></div></div>
      <div id="mtbWrap"><label class="f">Final set</label><div class="seg" data-key="matchTb">
        <button data-v="0">Full set</button><button data-v="1">Match tiebreak (10)</button></div></div>
      <div><label class="f">Scoring</label><div class="seg" data-key="noAd">
        <button data-v="0">Advantage</button><button data-v="1">No-ad</button></div></div>
      <div><label class="f">Serves first</label><div class="seg" data-key="firstServer">
        <button data-v="0" id="fs0">Player 1</button><button data-v="1" id="fs1">Player 2</button></div></div>
    </div>
    <div style="flex:1"></div>
    <button class="big primary" id="btnStart">Start match</button>
  </section>

  <!-- PLAY -->
  <section class="screen" id="s-play">
    <div class="topbar">
      <button class="pill" id="btnUndo">↶ Undo</button>
      <span style="display:flex;gap:8px"><button class="pill" id="btnSave">💾 Save &amp; exit</button>
      <button class="pill" id="btnMenu" aria-label="More">•••</button></span>
    </div>
    <div class="sb" id="scoreboard"></div>
    <div class="tags" id="tags"></div>
    <div class="prompt"><div class="q" id="pq"></div><div class="sub" id="psub"></div></div>
    <div class="actions" id="actions"></div>
  </section>

  <!-- STATS -->
  <section class="screen" id="s-stats">
    <div class="topbar"><button class="pill" id="statsBack">‹ Home</button><h2>Match stats</h2><button class="pill" id="statsUndo">↶ Undo</button></div>
    <div class="stitle"><div class="muted small" id="statsMeta"></div><div class="winner" id="statsWinner"></div></div>
    <table class="st" id="statsTable"></table>
    <div class="btnrow">
      <button class="big secondary" id="btnShare">Share / Copy</button>
      <button class="big primary" id="btnNew2">New match</button>
    </div>
    <button class="big secondary" id="btnGames">Game history</button>
    <button class="big danger" id="btnDelete" style="display:none">Delete from history</button>
  </section>

  <!-- HISTORY -->
  <section class="screen" id="s-gamehist">
    <div class="topbar"><button class="pill" id="ghBack">‹ Back</button><h2>Game history</h2><span style="width:70px"></span></div>
    <div class="muted small" id="ghMeta" style="text-align:center"></div>
    <div class="ghlegend">Scores server first · tiebreaks <span id="ghTbOrder"></span><br><b>A</b> ace · <b>DF</b> double fault · <b>W</b> winner · <b>N</b> error in net · <b>O</b> error out/side</div>
    <div id="ghList"></div>
  </section>

  <section class="screen" id="s-history">
    <div class="topbar"><button class="pill" data-go="home">‹ Back</button><h2>History</h2><span style="width:70px"></span></div>
    <div class="hlist" id="hlist"></div>
  </section>
</div>

<div class="sheet-bg" id="menu">
  <div class="sheet">
    <button class="big primary" id="mSave">Save &amp; exit (resume later)</button>
    <div class="btnrow"><button class="big secondary" id="mStats">Stats so far</button><button class="big secondary" id="mGames">Game history</button></div>
    <button class="big secondary" id="mEnd">End match now (move to history)</button>
    <button class="big danger" id="mDelete">Delete match</button>
    <button class="big secondary" id="mClose">Cancel</button>
  </div>
</div>
<div class="sheet-bg center" id="confirm">
  <div class="dialog" role="alertdialog" aria-modal="true">
    <div class="dt" id="cTitle"></div>
    <div class="dm" id="cMsg"></div>
    <button class="big dangerSolid" id="cOk">Delete</button>
    <button class="big secondary" id="cCancel">Cancel</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== ENGINE START =====
/* Tennis scoring engine. State is rebuilt by replaying the event log.
   Events: 'ace' | 'in' | 'fault' | 'df' | 'w0' | 'w1'  */
var Engine = (function(){
  function mkStats(){ return {points:0,games:0,aces:0,dfs:0,servePts:0,firstIn:0,firstWon:0,secondPts:0,secondWon:0,
    svcGames:0,svcWon:0,bpOpp:0,bpWon:0,recvPts:0,recvWon:0,maxGames:0,maxPts:0,winners:0,ue:0,ueNet:0,ueOut:0}; }

  function init(cfg){
    var s = {
      cfg: cfg, sets: [], games:[0,0], pts:[0,0], tb:false, tbTarget:7, mtb:false, tbFirst:null,
      server: cfg.firstServer|0, phase:'serve1', setsWon:[0,0], over:false, winner:null,
      stats:[mkStats(), mkStats()], ptStreak:{who:-1,n:0}, gmStreak:{who:-1,n:0}, nPoints:0
    };
    maybeStartMatchTb(s);
    return s;
  }
  function need(cfg){ return Math.floor(cfg.bestOf/2)+1; }
  function maybeStartMatchTb(s){
    var n = need(s.cfg);
    if (s.cfg.matchTb && s.cfg.bestOf>1 && s.setsWon[0]===n-1 && s.setsWon[1]===n-1){
      s.tb = true; s.mtb = true; s.tbTarget = 10; s.tbFirst = s.server;
    }
  }
  function pointServer(s){
    if (!s.tb) return s.server;
    var n = s.pts[0]+s.pts[1];
    if (n===0) return s.tbFirst;
    return (Math.floor((n-1)/2)%2===0) ? 1-s.tbFirst : s.tbFirst;
  }
  function isBreakPoint(s){
    if (s.tb || s.over) return false;
    var srv = s.server, r = 1-srv, rp = s.pts[r], sp = s.pts[srv];
    if (s.cfg.noAd) return rp===3;           // includes deciding point at 40-40
    return rp>=3 && rp>sp;
  }
  function clone(s){ return JSON.parse(JSON.stringify(s)); }
  // Would player p winning the next point win the set / match?
  function pointWins(s, p){
    if (s.over) return {set:false, match:false};
    var c = clone(s); var setsBefore = c.sets.length;
    awardPoint(c, p, {first:true}, true);
    return {set: c.sets.length>setsBefore, match: c.over};
  }
  function streak(st, who, key, stats){
    if (st.who===who) st.n++; else { st.who=who; st.n=1; }
    if (st.n>stats[who][key]) stats[who][key]=st.n;
  }
  function awardPoint(s, w, info, quiet){
    var srv = pointServer(s), rcv = 1-srv, st = s.stats, l = 1-w;
    if (!quiet){
      var bp = isBreakPoint(s);
      st[srv].servePts++;
      if (info.first){ st[srv].firstIn++; if (w===srv) st[srv].firstWon++; }
      else { st[srv].secondPts++; if (w===srv) st[srv].secondWon++; }
      if (info.ace) st[srv].aces++;
      if (info.df) st[srv].dfs++;
      st[rcv].recvPts++; if (w===rcv) st[rcv].recvWon++;
      st[w].points++;
      if (bp){ st[rcv].bpOpp++; if (w===rcv) st[rcv].bpWon++; }
      streak(s.ptStreak, w, 'maxPts', st);
      s.nPoints++;
    }
    s.pts[w]++;
    var p = s.pts;
    if (s.tb){
      if (p[w]>=s.tbTarget && p[w]-p[l]>=2) gameWon(s, w, quiet);
    } else {
      var done = s.cfg.noAd ? p[w]>=4 : (p[w]>=4 && p[w]-p[l]>=2);
      if (done){
        if (!quiet){ st[s.server].svcGames++; if (w===s.server) st[s.server].svcWon++; }
        gameWon(s, w, quiet);
      }
    }
    s.phase = 'serve1';
  }
  function gameWon(s, w, quiet){
    var l = 1-w, wasTb = s.tb, tbScore = wasTb ? s.pts.slice() : null, wasMtb = s.mtb;
    s.games[w]++;
    if (!quiet){ s.stats[w].games++; streak(s.gmStreak, w, 'maxGames', s.stats); }
    s.server = wasTb ? 1-s.tbFirst : 1-s.server;
    s.pts = [0,0]; s.tb = false; s.mtb = false;
    var g = s.games, n = s.cfg.games, setDone = false;
    if (wasTb) setDone = true;
    else if (g[w]>=n && g[w]-g[l]>=2) setDone = true;
    else if (s.cfg.tiebreak && g[0]===n && g[1]===n){ s.tb = true; s.tbTarget = 7; s.tbFirst = s.server; }
    if (setDone){
      s.sets.push({g:g.slice(), tb:tbScore, mtb:wasMtb, winner:w});
      s.setsWon[w]++; s.games = [0,0];
      if (s.setsWon[w]>=need(s.cfg)){ s.over = true; s.winner = w; s.phase = 'over'; return; }
      maybeStartMatchTb(s);
    }
  }
  function apply(s, ev){
    // 'how' phase: how the last rally point ended. Events: 'win' (winner by point winner),
    // 'net' / 'out' (unforced error by point loser). Older logs have no such event: any
    // other event here means "unknown" and is processed normally.
    if (s.phase==='how'){
      var hw = s.howWinner, hl = 1-hw;
      s.phase = s.over ? 'over' : 'serve1'; s.howWinner = null;
      if (ev==='win'){ s.stats[hw].winners++; return true; }
      if (ev==='net'||ev==='out'){ s.stats[hl].ue++; s.stats[hl][ev==='net'?'ueNet':'ueOut']++; return true; }
    }
    if (s.over) return false;
    var srv = pointServer(s);
    switch (s.phase){
      case 'serve1':
        if (ev==='ace'){ awardPoint(s, srv, {first:true, ace:true}); return true; }
        if (ev==='in'){ s.phase='rally1'; return true; }
        if (ev==='fault'){ s.phase='serve2'; return true; }
        return false;
      case 'serve2':
        if (ev==='ace'){ awardPoint(s, srv, {first:false, ace:true}); return true; }
        if (ev==='in'){ s.phase='rally2'; return true; }
        if (ev==='df'){ awardPoint(s, 1-srv, {first:false, df:true}); return true; }
        return false;
      case 'rally1': case 'rally2':
        if (ev==='w0'||ev==='w1'){ var pw = ev==='w0'?0:1; awardPoint(s, pw, {first:s.phase==='rally1'}); s.phase='how'; s.howWinner=pw; return true; }
        return false;
    }
    return false;
  }
  function replay(cfg, events){
    var s = init(cfg);
    for (var i=0;i<events.length;i++) apply(s, events[i]);
    return s;
  }
  function pointLabel(s){
    var p = s.pts;
    if (s.tb) return [String(p[0]), String(p[1])];
    var names = ['0','15','30','40'];
    if (p[0]>=3 && p[1]>=3){
      if (s.cfg.noAd) return ['40','40'];
      if (p[0]===p[1]) return ['40','40'];
      return p[0]>p[1] ? ['AD',''] : ['','AD'];
    }
    return [names[Math.min(p[0],3)], names[Math.min(p[1],3)]];
  }
  function isDeuce(s){ return !s.tb && s.pts[0]>=3 && s.pts[0]===s.pts[1]; }
  // Label of a game score after a point, server first (tiebreak: player order).
  function progLabel(p, srv, tb, noAd){
    if (tb) return p[0]+'-'+p[1];
    var a=p[srv], b=p[1-srv], N=['0','15','30','40'];
    if (a>=3 && b>=3){
      if (noAd || a===b) return a===b ? (noAd?'40-40':'Deuce') : '';
      return a>b ? 'Ad-in' : 'Ad-out';
    }
    return N[Math.min(a,3)]+'-'+N[Math.min(b,3)];
  }
  /* Game-level history: [{set, num, server, tb, mtb, points:[{w,label,mark}], winner, score:[a,b], brk, inProgress}] */
  function gameHistory(cfg, events){
    var s = init(cfg), out = [], g = null, last = null;
    function start(){ g = {set:s.sets.length+1, num:s.games[0]+s.games[1]+1, server:s.tb?s.tbFirst:s.server, tb:s.tb, mtb:s.mtb,
                           points:[], winner:null, score:null, brk:false, inProgress:true}; }
    start();
    for (var i=0;i<events.length;i++){
      var ev = events[i], srv = pointServer(s), pre = s.pts.slice(), np = s.nPoints, ph = s.phase,
          nSets = s.sets.length, gsum = s.games[0]+s.games[1], tb = s.tb;
      if (!apply(s, ev)) continue;
      if (s.nPoints > np){
        var w = ev==='ace' ? srv : ev==='df' ? 1-srv : (ev==='w0'?0:1);
        var after = pre.slice(); after[w]++;
        var ended = s.sets.length!==nSets || s.games[0]+s.games[1]!==gsum;
        last = {w:w, srv:srv, mark: ev==='ace'?'A':ev==='df'?'DF':'',
                label: ended ? (tb ? after[0]+'-'+after[1] : (w===g.server?'Game':'Break')) : progLabel(after, g.server, tb, cfg.noAd)};
        g.points.push(last);
        if (ended){
          g.winner = w; g.inProgress = false; g.brk = !tb && w!==g.server;
          g.score = s.sets.length!==nSets ? s.sets[s.sets.length-1].g.slice() : s.games.slice();
          out.push(g); start();
        }
      } else if (ph==='how' && last && (ev==='win'||ev==='net'||ev==='out')){
        last.mark = ev==='win' ? 'W' : ev==='net' ? 'N' : 'O';
      }
    }
    if (!s.over){ g.score = s.games.slice(); out.push(g); }
    return out;
  }
  return {gameHistory:gameHistory, progLabel:progLabel, init:init, apply:apply, replay:replay, pointServer:pointServer, isBreakPoint:isBreakPoint,
          pointWins:pointWins, pointLabel:pointLabel, isDeuce:isDeuce, need:need};
})();
if (typeof module!=='undefined') module.exports = Engine;
// ===== ENGINE END =====
</script>

<script>
// ===== STORE START =====
/* Local storage layer. Keys:
   tennis.saved.v1   – array of in-progress matches [{id,cfg,events,startedAt,updatedAt}]
   tennis.history.v1 – array of finished matches (newest first)
   tennis.active.v1  – id of the match open on the play screen (for reload-resume)
   tennis.current.v1 – OLD single-match format, migrated on load */
function makeStore(ls){
  var K={saved:'tennis.saved.v1', hist:'tennis.history.v1', active:'tennis.active.v1', old:'tennis.current.v1', cfg:'tennis.lastcfg.v1'};
  function load(k,d){ try{ var v=ls.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  function save(k,v){ try{ ls.setItem(k, JSON.stringify(v)); }catch(e){} }
  var S = {
    K:K, load:load, save:save,
    listSaved:function(){ return load(K.saved,[]).sort(function(a,b){ return (b.updatedAt||b.startedAt)-(a.updatedAt||a.startedAt); }); },
    getSaved:function(id){ return load(K.saved,[]).filter(function(m){return m.id===id;})[0]||null; },
    upsertSaved:function(m){ m.updatedAt=Date.now(); var a=load(K.saved,[]).filter(function(x){return x.id!==m.id;}); a.unshift(m); save(K.saved,a); },
    removeSaved:function(id){ save(K.saved, load(K.saved,[]).filter(function(x){return x.id!==id;})); if (S.getActive()===id) S.setActive(null); },
    listHistory:function(){ return load(K.hist,[]); },
    addHistory:function(m){ var h=load(K.hist,[]).filter(function(x){return x.id!==m.id;}); h.unshift(m); save(K.hist,h); },
    removeHistory:function(id){ save(K.hist, load(K.hist,[]).filter(function(x){return x.id!==id;})); },
    getActive:function(){ return load(K.active,null); },
    setActive:function(id){ if (id) save(K.active,id); else ls.removeItem(K.active); },
    migrate:function(){
      var old = load(K.old, null);
      if (!old) return false;
      if (!old.id) old.id = 'm'+(old.startedAt||Date.now());
      if (old.finishedAt){ if (!S.listHistory().some(function(x){return x.id===old.id;})) S.addHistory(old); }
      else if (old.events && old.events.length || old.cfg){
        if (!S.getSaved(old.id)) S.upsertSaved(old);
        S.setActive(old.id);   // it was the open match, keep it open
      }
      ls.removeItem(K.old);
      return true;
    }
  };
  return S;
}
if (typeof module!=='undefined') module.exports.makeStore = makeStore;
// ===== STORE END =====
</script>

<script>
(function(){
  var DEFAULT_CFG={names:['Player 1','Player 2'],bestOf:3,games:6,tiebreak:1,matchTb:0,noAd:0,firstServer:0};
  var $=function(id){return document.getElementById(id)};
  function esc(t){ return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
  var LS = (function(){
    try { var s = window.localStorage, k='__t'; s.setItem(k,'1'); s.removeItem(k); return s; }
    catch(e){ var m={}; return {getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];},clear:function(){m={};},key:function(i){return Object.keys(m)[i]||null;},get length(){return Object.keys(m).length;}}; }
  })();
  var Store = makeStore(LS);
  Store.migrate();

  var cur = null;                    // match open on the play screen
  var viewing = null;                // match shown on the stats screen
  var cfgDraft = Object.assign({}, DEFAULT_CFG, Store.load(Store.K.cfg, {}));

  function show(name){
    document.querySelectorAll('.screen').forEach(function(e){ e.classList.remove('active'); });
    $('s-'+name).classList.add('active'); window.scrollTo(0,0);
    if (name==='home') renderHome();
    if (name==='history') renderHistory();
  }
  document.querySelectorAll('[data-go]').forEach(function(b){ b.onclick=function(){ show(b.dataset.go); }; });
  function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove('on')},1800); }

  // ---------- In-app confirm (one clear step) ----------
  var confirmCb=null;
  function ask(title, msg, okLabel, cb){
    $('cTitle').textContent=title; $('cMsg').textContent=msg; $('cOk').textContent=okLabel||'Delete';
    confirmCb=cb; $('confirm').classList.add('on');
  }
  $('cOk').onclick=function(){ $('confirm').classList.remove('on'); var f=confirmCb; confirmCb=null; if (f) f(); };
  $('cCancel').onclick=function(){ $('confirm').classList.remove('on'); confirmCb=null; };
  $('confirm').onclick=function(e){ if (e.target===this) $('cCancel').onclick(); };

  // ---------- Match open/close ----------
  function openMatch(m){ cur=m; Store.setActive(m.id); show('play'); renderPlay(); }
  function persist(){ if (cur) Store.upsertSaved(cur); }      // auto-save on every tap
  function saveAndExit(){ persist(); Store.setActive(null); cur=null; show('home'); toast('Match saved – resume it from Home'); }
  function deleteMatch(id, after){
    var m = Store.getSaved(id) || (cur&&cur.id===id?cur:null);
    var label = m ? m.cfg.names[0]+' vs '+m.cfg.names[1] : 'this match';
    ask('Delete match?', label+' – the score and all stats will be permanently deleted.', 'Delete match', function(){
      Store.removeSaved(id); if (cur && cur.id===id){ cur=null; Store.setActive(null); }
      toast('Match deleted'); after && after();
    });
  }

  // ---------- HOME ----------
  function renderHome(){
    var saved = Store.listSaved();
    $('savedWrap').style.display = saved.length ? '' : 'none';
    $('savedCount').textContent = saved.length;
    $('btnNew').className = 'big primary';
    $('savedList').innerHTML = saved.map(function(m){
      var s = Engine.replay(m.cfg, m.events);
      return '<div class="mrow"><button class="mopen" data-id="'+m.id+'"><div class="t">'+esc(m.cfg.names[0])+' vs '+esc(m.cfg.names[1])+'</div>'+
        '<div class="s score">'+esc(scoreLine(s,true))+'</div><div class="s">'+fmtDate(m.updatedAt||m.startedAt)+' · Set '+(s.sets.length+1)+' · '+s.nPoints+' pts</div></button>'+
        '<button class="mdel" data-del="'+m.id+'" aria-label="Delete match">🗑</button></div>';
    }).join('');
    var hn = Store.listHistory().length;
    $('btnHistory').textContent = 'Match history'+(hn?' ('+hn+')':'');
  }
  $('savedList').addEventListener('click', function(e){
    var d=e.target.closest('[data-del]'); if (d){ deleteMatch(d.dataset.del, renderHome); return; }
    var o=e.target.closest('[data-id]'); if (o){ var m=Store.getSaved(o.dataset.id); if (m) openMatch(m); }
  });
  $('btnNew').onclick=function(){ openSetup(); };
  $('btnHistory').onclick=function(){ show('history'); };

  // ---------- SETUP ----------
  function openSetup(){ $('nA').value=cfgDraft.names[0]; $('nB').value=cfgDraft.names[1]; syncSeg(); show('setup'); }
  function syncSeg(){
    document.querySelectorAll('.seg').forEach(function(seg){
      var k=seg.dataset.key;
      seg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', String(cfgDraft[k])===b.dataset.v); });
    });
    $('mtbWrap').style.display = cfgDraft.bestOf>1 ? '' : 'none';
    $('fs0').textContent = $('nA').value.trim()||'Player 1';
    $('fs1').textContent = $('nB').value.trim()||'Player 2';
  }
  document.querySelectorAll('.seg').forEach(function(seg){
    seg.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ cfgDraft[seg.dataset.key]=parseInt(b.dataset.v,10); syncSeg(); }; });
  });
  $('nA').oninput=$('nB').oninput=syncSeg;
  $('btnStart').onclick=function(){
    var cfg = Object.assign({}, cfgDraft);
    cfg.names=[$('nA').value.trim()||'Player 1', $('nB').value.trim()||'Player 2'];
    if (cfg.bestOf===1) cfg.matchTb=0;
    cfgDraft = Object.assign({}, cfg); Store.save(Store.K.cfg, cfgDraft);
    var m = {id:'m'+Date.now(), cfg:cfg, events:[], startedAt:Date.now(), finishedAt:null};
    Store.upsertSaved(m); openMatch(m);
  };

  // ---------- PLAY ----------
  function setsCells(s, p){
    var h='';
    s.sets.forEach(function(st){
      var sup = st.tb && !st.mtb && st.winner!==p ? '<sup>'+st.tb[p]+'</sup>' : '';
      var val = st.mtb ? st.tb[p] : st.g[p];
      h += '<span class="'+(st.winner===p?'w':'')+'">'+val+sup+'</span>';
    });
    return h;
  }
  function renderPlay(){
    var s = Engine.replay(cur.cfg, cur.events), n = cur.cfg.names;
    if (s.over && s.phase!=='how'){ finishMatch(); return; }
    var srv = Engine.pointServer(s), rcv = 1-srv, lbl = Engine.pointLabel(s);
    var sb='';
    for (var p=0;p<2;p++){
      sb += '<div class="sbrow"><div class="sdot '+(srv===p?'on':'')+'"></div><div class="sname">'+esc(n[p])+'</div>'+
            '<div class="ssets">'+setsCells(s,p)+'</div>'+
            '<div class="sgames">'+(s.mtb?'':s.games[p])+'</div><div class="spts">'+(lbl[p]||'&nbsp;')+'</div></div>';
    }
    var fmt = 'Best of '+cur.cfg.bestOf+' · '+cur.cfg.games+' games'+(cur.cfg.noAd?' · No-ad':'');
    sb += '<div class="sbfoot"><span>Set '+(s.sets.length+1)+(s.tb?(s.mtb?' · Match tiebreak':' · Tiebreak'):'')+' · '+s.nPoints+' pts</span><span>'+fmt+'</span></div>';
    $('scoreboard').innerHTML = sb;

    var tags='';
    if (s.tb) tags+='<span class="tag tb">'+(s.mtb?'Match tiebreak':'Tiebreak')+' · first to '+s.tbTarget+'</span>';
    if (Engine.isDeuce(s)) tags+= cur.cfg.noAd ? '<span class="tag dp">Deciding point</span>' : '<span class="tag dp">Deuce</span>';
    var mp=false, sp=false;
    [0,1].forEach(function(p){ var r=Engine.pointWins(s,p); if (r.match) mp=true; else if (r.set) sp=true; });
    if (mp) tags+='<span class="tag mp">Match point</span>'; else if (sp) tags+='<span class="tag sp">Set point</span>';
    if (Engine.isBreakPoint(s)) tags+='<span class="tag bp">Break point</span>';
    if (s.phase==='how') tags = '<span class="tag dp">Point '+esc(n[s.howWinner])+'</span>';
    $('tags').innerHTML = tags;

    var q, sub, acts;
    if (s.phase==='serve1'){
      q = esc(n[srv])+' – 1st serve'; sub = 'Serving to '+esc(n[rcv]);
      acts = [['ace','a-ace','Ace',''],['in','a-in','In','rally'],['fault','a-fault','Fault','']];
    } else if (s.phase==='serve2'){
      q = esc(n[srv])+' – 2nd serve'; sub = 'Serving to '+esc(n[rcv]);
      acts = [['ace','a-ace','Ace',''],['in','a-in','In','rally'],['df','a-df','Double fault','point to '+esc(n[rcv])]];
    } else if (s.phase==='how'){
      var hw = s.howWinner, hl = 1-hw;
      q = 'How did '+esc(n[hw])+' win it?'; sub = 'Point to '+esc(n[hw]);
      acts = [['win','a-ace','Winner','by '+esc(n[hw])],
              ['net','a-fault','<span class="nm">'+esc(n[hl])+' error – net</span>','unforced error'],
              ['out','a-df','<span class="nm">'+esc(n[hl])+' error – out/side</span>','unforced error']];
    } else {
      q = 'Who won the point?'; sub = (s.phase==='rally1'?'1st':'2nd')+' serve in';
      acts = [['w0','a-p0','<span class="nm">'+esc(n[0])+'</span>',srv===0?'server':'receiver'],
              ['w1','a-p1','<span class="nm">'+esc(n[1])+'</span>',srv===1?'server':'receiver']];
    }
    $('pq').innerHTML = q; $('psub').innerHTML = sub;
    $('actions').className = 'actions'+(s.phase==='how'?' how':'');
    $('actions').innerHTML = acts.map(function(a){
      return '<button class="act '+a[1]+'" data-ev="'+a[0]+'">'+a[2]+(a[3]?'<small>'+a[3]+'</small>':'')+'</button>';
    }).join('');
    $('btnUndo').disabled = cur.events.length===0;
  }
  var lastTap=0;
  $('actions').addEventListener('click', function(e){
    var b = e.target.closest('button[data-ev]'); if (!b) return;
    var now=Date.now(); if (now-lastTap<250) return; lastTap=now;   // guard against double-taps
    cur.events.push(b.dataset.ev); persist(); renderPlay();
  });
  $('btnUndo').onclick=function(){ if (!cur.events.length) return; cur.events.pop(); persist(); renderPlay(); toast('Undone'); };
  $('btnSave').onclick=saveAndExit;

  // Menu
  function closeMenu(){ $('menu').classList.remove('on'); }
  $('btnMenu').onclick=function(){ $('menu').classList.add('on'); };
  $('mClose').onclick=closeMenu;
  $('menu').onclick=function(e){ if (e.target===this) closeMenu(); };
  $('mSave').onclick=function(){ closeMenu(); saveAndExit(); };
  $('mStats').onclick=function(){ closeMenu(); showStats(cur, 'live'); };
  $('mGames').onclick=function(){ closeMenu(); showGames(cur, 'play'); };
  $('mEnd').onclick=function(){ closeMenu(); ask('End match now?', 'The match will be finished as it stands and moved to history.', 'End match', function(){ finishMatch(true); }); };
  $('mDelete').onclick=function(){ closeMenu(); deleteMatch(cur.id, function(){ show('home'); }); };

  var justFinished=null;
  function finishMatch(early){
    if (!cur.finishedAt){ cur.finishedAt = Date.now(); cur.early = !!early; }
    Store.removeSaved(cur.id); Store.addHistory(cur); Store.setActive(null);
    justFinished = cur; cur = null;
    showStats(justFinished, 'final');
  }

  // ---------- STATS ----------
  function pct(a,b){ return b? Math.round(100*a/b)+'%' : '–'; }
  function frac(a,b){ return a+' / '+b+' ('+pct(a,b)+')'; }
  function scoreLine(s, withCurrent){
    var parts = s.sets.map(function(st){
      if (st.mtb) return '['+st.tb[0]+'-'+st.tb[1]+']';
      return st.g[0]+'-'+st.g[1]+(st.tb?'('+Math.min(st.tb[0],st.tb[1])+')':'');
    });
    if (withCurrent && !s.over){
      var l=Engine.pointLabel(s);
      parts.push(s.mtb ? '['+s.pts[0]+'-'+s.pts[1]+']' : s.games[0]+'-'+s.games[1]+(s.pts[0]+s.pts[1]?' ('+(l[0]||'–')+'/'+(l[1]||'–')+')':''));
    }
    return parts.join('  ') || '0-0';
  }
  function playerScore(s,p){
    return s.sets.map(function(st){
      if (st.mtb) return st.tb[p];
      return st.g[p]+(st.tb && st.winner!==p ? '<sup>'+st.tb[p]+'</sup>' : '');
    }).join('&nbsp;&nbsp;');
  }
  function statRows(s){
    var a=s.stats[0], b=s.stats[1];
    function r(label,f,num){ return {label:label, v:[f(a),f(b)], n:num?[num(a),num(b)]:null}; }
    return [
      r('Games Won', function(x){return x.games}, function(x){return x.games}),
      r('Points Won', function(x){return x.points}, function(x){return x.points}),
      r('Aces', function(x){return x.aces}, function(x){return x.aces}),
      r('Double Faults', function(x){return x.dfs}, function(x){return -x.dfs}),
      r('First Serve %', function(x){return pct(x.firstIn,x.servePts)+' ('+x.firstIn+'/'+x.servePts+')'}, function(x){return x.servePts?x.firstIn/x.servePts:0}),
      r('First Serve Points Won', function(x){return frac(x.firstWon,x.firstIn)}, function(x){return x.firstIn?x.firstWon/x.firstIn:0}),
      r('Second Serve Points Won', function(x){return frac(x.secondWon,x.secondPts)}, function(x){return x.secondPts?x.secondWon/x.secondPts:0}),
      r('Service Games Won', function(x){return x.svcWon+' / '+x.svcGames}, function(x){return x.svcGames?x.svcWon/x.svcGames:0}),
      r('Break Points Won', function(x){return x.bpWon+' / '+x.bpOpp}, function(x){return x.bpWon}),
      r('Receiver Points Won', function(x){return frac(x.recvWon,x.recvPts)}, function(x){return x.recvPts?x.recvWon/x.recvPts:0}),
      r('Winners', function(x){return x.winners}, function(x){return x.winners}),
      r('Unforced Errors', function(x){return x.ue}, function(x){return -x.ue}),
      r('UE – Net', function(x){return x.ueNet}, function(x){return -x.ueNet}),
      r('UE – Out/Side', function(x){return x.ueOut}, function(x){return -x.ueOut}),
      r('Max Games in a Row', function(x){return x.maxGames}, function(x){return x.maxGames}),
      r('Max Points in a Row', function(x){return x.maxPts}, function(x){return x.maxPts})
    ];
  }
  function dur(m){ var ms=(m.finishedAt||m.updatedAt||Date.now())-m.startedAt, mins=Math.max(0,Math.round(ms/60000)); return mins>=60? Math.floor(mins/60)+'h '+(mins%60)+'m' : mins+'m'; }
  function fmtDate(t){ var d=new Date(t); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }

  var statsMode='final';
  function showStats(m, mode){
    viewing = m; statsMode = mode;
    var s = Engine.replay(m.cfg, m.events), n = m.cfg.names;
    $('statsMeta').textContent = fmtDate(m.startedAt)+' · '+dur(m)+' · Best of '+m.cfg.bestOf;
    $('statsWinner').textContent = s.over ? n[s.winner]+' wins '+scoreLine(s) : (mode==='live'?'In progress · ':'Ended early · ')+scoreLine(s,true);
    var res = function(p){ if (!s.over) return ''; return s.winner===p?'<span class="res win">WIN</span>':'<span class="res lose">LOSE</span>'; };
    var h = '<tr><th class="lbl"></th><th>'+esc(n[0])+'</th><th>'+esc(n[1])+'</th></tr>';
    h += '<tr><td class="lbl">Score</td><td class="best">'+(playerScore(s,0)||'–')+res(0)+'</td><td class="best">'+(playerScore(s,1)||'–')+res(1)+'</td></tr>';
    statRows(s).forEach(function(row){
      var c0='',c1='';
      if (row.n && row.n[0]!==row.n[1]){ if (row.n[0]>row.n[1]) c0='best'; else c1='best'; }
      h += '<tr><td class="lbl">'+row.label+'</td><td class="'+c0+'">'+row.v[0]+'</td><td class="'+c1+'">'+row.v[1]+'</td></tr>';
    });
    $('statsTable').innerHTML = h;
    var canUndo = mode==='live' || (mode==='final' && justFinished && justFinished.id===m.id && m.events.length);
    $('statsUndo').style.visibility = canUndo ? 'visible' : 'hidden';
    $('statsUndo').textContent = mode==='live' ? '‹ Match' : '↶ Undo';
    $('statsBack').textContent = mode==='history' ? '‹ History' : '‹ Home';
    $('btnDelete').style.display = mode==='history' ? '' : 'none';
    $('btnNew2').style.display = mode==='live' ? 'none' : '';
    $('btnShare').parentNode.style.gridTemplateColumns = mode==='live' ? '1fr' : '1fr 1fr';
    show('stats');
  }
  $('statsBack').onclick=function(){ justFinished=null; show(statsMode==='history'?'history':'home'); };
  $('statsUndo').onclick=function(){
    if (statsMode==='live'){ show('play'); renderPlay(); return; }
    // Re-open the just-finished match and undo its last step
    var m = justFinished; justFinished=null;
    Store.removeHistory(m.id);
    m.finishedAt=null; m.early=false;
    if (Engine.replay(m.cfg, m.events).over) m.events.pop();
    Store.upsertSaved(m); openMatch(m); toast('Undone – match resumed');
  };
  $('btnNew2').onclick=function(){ justFinished=null; openSetup(); };
  function deleteHistory(id, after){
    var m = Store.listHistory().filter(function(x){return x.id===id;})[0];
    ask('Delete from history?', (m? m.cfg.names[0]+' vs '+m.cfg.names[1]+' – ':'')+'this finished match and its stats will be permanently deleted.', 'Delete', function(){
      Store.removeHistory(id); toast('Match deleted'); after && after();
    });
  }
  // ---------- GAME HISTORY ----------
  var ghFrom='play';
  function showGames(m, from){
    ghFrom = from; var n = m.cfg.names, gs = Engine.gameHistory(m.cfg, m.events), s = Engine.replay(m.cfg, m.events);
    $('ghMeta').textContent = n[0]+' vs '+n[1]+' · '+scoreLine(s, true);
    $('ghTbOrder').textContent = n[0]+'–'+n[1];
    var h='', set=0;
    gs.forEach(function(g){
      if (g.set!==set){
        set=g.set; var st=s.sets[set-1];
        h += '<div class="ghset"><span>Set '+set+'</span>'+(st?'<b>'+esc(n[st.winner])+' '+(st.mtb?st.tb[st.winner]+'-'+st.tb[1-st.winner]:st.g[st.winner]+'-'+st.g[1-st.winner])+'</b>':'<span>in progress</span>')+'</div>';
      }
      var badge = g.inProgress ? '<span class="ipb">IN PROGRESS</span>' : g.brk ? '<span class="brk">BREAK</span>' : g.tb ? '<span class="tbb">'+(g.mtb?'MATCH TB':'TIEBREAK')+'</span>' : '';
      var who = g.inProgress ? '' : '<span class="ghw">'+esc(n[g.winner])+'</span>';
      var sc = g.mtb ? '' : g.score[0]+'-'+g.score[1];
      var pts = g.points.map(function(p,i){
        var end = !g.inProgress && i===g.points.length-1;
        return '<span class="p'+p.w+(end?' end':'')+'">'+esc(p.label)+(p.mark?'<sup>'+p.mark+'</sup>':'')+'</span>';
      }).join('');
      h += '<div class="gh'+(g.inProgress?' live':'')+'"><div class="ghh"><span class="ghn">'+(g.tb?'TB':'G'+g.num)+'</span>'+
           '<span class="ghsrv"><i></i>'+esc(n[g.server])+(g.tb?' first':'')+'</span>'+badge+who+'<span class="ghsc">'+sc+'</span></div>'+
           '<div class="ghp">'+(pts||'<span class="muted">not started</span>')+'</div></div>';
    });
    h += '<div class="ghk"><span class="k0">'+esc(n[0])+' won point</span><span class="k1">'+esc(n[1])+' won point</span></div>';
    $('ghList').innerHTML = h || '<div class="empty">No points yet.</div>';
    show('gamehist');
  }
  $('ghBack').onclick=function(){ if (ghFrom==='play' && cur){ show('play'); renderPlay(); } else show(ghFrom); };
  $('btnGames').onclick=function(){ if (viewing) showGames(viewing, 'stats'); };
  $('btnDelete').onclick=function(){ if (viewing) deleteHistory(viewing.id, function(){ show('history'); }); };
  function statsText(m){
    var s = Engine.replay(m.cfg, m.events), n=m.cfg.names, rows=statRows(s);
    var t = '🎾 '+n[0]+' vs '+n[1]+'\n'+fmtDate(m.startedAt)+' · '+dur(m)+'\n';
    t += (s.over ? n[s.winner]+' won '+scoreLine(s) : 'Score: '+scoreLine(s,true)+(m.finishedAt?' (ended early)':' (in progress)'))+'\n\n';
    t += '— '+n[0]+' | '+n[1]+'\n';
    rows.forEach(function(r){ t += r.label+': '+r.v[0]+' | '+r.v[1]+'\n'; });
    return t;
  }
  $('btnShare').onclick=function(){
    var t = statsText(viewing);
    if (navigator.share){ navigator.share({title:'Tennis match stats', text:t}).catch(function(){}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast('Stats copied')},function(){fallbackCopy(t)}); }
    else fallbackCopy(t);
  };
  function fallbackCopy(t){ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Stats copied');}catch(e){ alert(t); } ta.remove(); }

  // ---------- HISTORY ----------
  function renderHistory(){
    var h = Store.listHistory();
    if (!h.length){ $('hlist').innerHTML='<div class="empty">No finished matches yet.</div>'; return; }
    $('hlist').innerHTML = h.map(function(m){
      var s = Engine.replay(m.cfg, m.events), n=m.cfg.names;
      var title = s.over ? esc(n[s.winner])+' d. '+esc(n[1-s.winner]) : esc(n[0])+' vs '+esc(n[1]);
      return '<div class="mrow"><button class="mopen" data-id="'+m.id+'"><div class="t">'+title+'</div><div class="s score">'+esc(scoreLine(s,!s.over))+(s.over?'':' · ended early')+'</div><div class="s">'+fmtDate(m.startedAt)+' · '+dur(m)+'</div></button>'+
        '<button class="mdel" data-del="'+m.id+'" aria-label="Delete match">🗑</button></div>';
    }).join('');
  }
  $('hlist').addEventListener('click', function(e){
    var d=e.target.closest('[data-del]'); if (d){ deleteHistory(d.dataset.del, renderHistory); return; }
    var o=e.target.closest('[data-id]'); if (!o) return;
    var m=Store.listHistory().filter(function(x){return x.id===o.dataset.id;})[0]; if (m) showStats(m, 'history');
  });

  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

  // Boot: reopen the match that was on screen (if any), otherwise Home
  var act = Store.getActive(), am = act && Store.getSaved(act);
  if (am) openMatch(am); else { Store.setActive(null); show('home'); }
  window.__tennis = {showGames:showGames, showStats:showStats, openMatch:openMatch, Store:Store};
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (hadController && !reloaded) { reloaded = true; location.reload(); } // match is auto-saved, so this is safe
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js', {scope:'./', updateViaCache:'none'}).then(function(reg){
      reg.update();
      document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') reg.update(); });
    }).catch(function(e){ console.warn('SW registration failed', e); });
  });
}
</script>
</body>
</html>
